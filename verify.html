<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantumMark Verification</title>
    <script src="js/api.js"></script>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #07111f; color: #f5f7ff; }
      .card { max-width: 720px; margin: 48px auto; padding: 24px; background: #101c31; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
      .muted { color: #8da0c6; }
      .pill { display: inline-block; padding: 6px 12px; background: #1d8b5f; border-radius: 999px; font-weight: 700; }
      .fail { background: #a33b3b; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
      .item { background: #18253f; padding: 12px; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>QuantumMark</h1>
      <h2>Digital Ownership Verification</h2>
      <p id="status" class="pill">Loading…</p>
      <div class="grid">
        <div class="item"><strong>Certificate ID</strong><div id="certificateId">-</div></div>
        <div class="item"><strong>Algorithm</strong><div id="algorithm">-</div></div>
        <div class="item"><strong>Timestamp</strong><div id="timestamp">-</div></div>
        <div class="item"><strong>Watermark</strong><div id="watermark">-</div></div>
        <div class="item"><strong>PSNR</strong><div id="psnr">-</div></div>
        <div class="item"><strong>SSIM</strong><div id="ssim">-</div></div>
        <div class="item"><strong>Entropy</strong><div id="entropy">-</div></div>
        <div class="item"><strong>Embedding Time</strong><div id="embeddingTime">-</div></div>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const verificationId = params.get('id');
      const status = document.getElementById('status');
      const { apiJson } = window.QuantumMarkAPI || {};
      if (!verificationId) {
        status.textContent = 'VERIFICATION FAILED ❌';
        status.className = 'pill fail';
      } else if (!apiJson) {
        status.textContent = 'VERIFICATION FAILED ❌';
        status.className = 'pill fail';
      } else {
        apiJson(`/certificate/verify/${encodeURIComponent(verificationId)}`)
          .then(({ body }) => {
            if (!body.success || !body.verified) {
              status.textContent = 'VERIFICATION FAILED ❌';
              status.className = 'pill fail';
              return;
            }
            status.textContent = 'OWNER VERIFIED ✅';
            status.className = 'pill';
            document.getElementById('certificateId').textContent = body.certificate.certificate_id || '-';
            document.getElementById('algorithm').textContent = body.certificate.algorithm || '-';
            document.getElementById('timestamp').textContent = body.certificate.timestamp || '-';
            document.getElementById('watermark').textContent = body.certificate.watermark || '-';
            document.getElementById('psnr').textContent = body.certificate.psnr ?? '-';
            document.getElementById('ssim').textContent = body.certificate.ssim ?? '-';
            document.getElementById('entropy').textContent = body.certificate.entropy ?? '-';
            document.getElementById('embeddingTime').textContent = body.certificate.embedding_time ?? '-';
          })
          .catch(() => {
            status.textContent = 'VERIFICATION FAILED ❌';
            status.className = 'pill fail';
          });
      }
    </script>
  </body>
</html>
